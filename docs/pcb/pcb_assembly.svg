<circle cx="102.00" cy="1704.00" r="3.50" fill="#2f8f5b" stroke="none" stroke-width="0" opacity="1.0"/>
<text x="118.00" y="1709.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#1d2a30" text-anchor="start" font-weight="normal" opacity="1.0" letter-spacing="0">Q1 TO-252 tab is soldered to a copper pour with a thermal via array; D2 SS34 is the heater freewheel diode.</text>
<circle cx="102.00" cy="1742.00" r="3.50" fill="#2f8f5b" stroke="none" stroke-width="0" opacity="1.0"/>
<text x="118.00" y="1747.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#1d2a30" text-anchor="start" font-weight="normal" opacity="1.0" letter-spacing="0">F2 KSD9700 400°C NC is in the heater harness, not on the PCB; keep it close to the handle.</text>
